name: App Store Connect Metadata

on:
  push:
    tags:
      - metadata-*
  workflow_dispatch:
    inputs:
      screenshot_run_id:
        description: "Optional completed App Store Screenshots workflow run ID; leave blank for metadata only"
        type: string
        default: ""
      verified_evidence_run_id:
        description: "Optional release evidence run with passing gameplay/legal checks on iPhone and iPad"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  upload-metadata:
    name: Upload metadata and screenshots
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
      APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
      APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_GITHUB_ISSUES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate localized metadata
        run: python scripts/localize.py --check

      - name: Validate screenshot input choice
        env:
          CAPTURE_RUN: ${{ inputs.screenshot_run_id }}
          EVIDENCE_RUN: ${{ inputs.verified_evidence_run_id }}
        run: |
          if [ -n "$CAPTURE_RUN" ] && [ -n "$EVIDENCE_RUN" ]; then
            echo "Choose one screenshot source, not both."
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download captured screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshot_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: app-store-screenshots
          path: build/raw-store-screenshots
          run-id: ${{ inputs.screenshot_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select and validate upload screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshot_run_id != ''
        run: |
          python scripts/curate_screenshots.py --input build/raw-store-screenshots --output fastlane/screenshots
          python scripts/validate_screenshots.py --store-ready
          echo "UPLOAD_SCREENSHOTS=1" >> "$GITHUB_ENV"

      - name: Download verified release captures
        if: github.event_name == 'workflow_dispatch' && inputs.verified_evidence_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          path: build/verified-evidence
          run-id: ${{ inputs.verified_evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package unmodified verified screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.verified_evidence_run_id != ''
        env:
          EVIDENCE_RUN: ${{ inputs.verified_evidence_run_id }}
        run: |
          python scripts/prepare_verified_screenshots.py --input build/verified-evidence --output fastlane/screenshots --source-run "$EVIDENCE_RUN"
          echo "UPLOAD_SCREENSHOTS=1" >> "$GITHUB_ENV"

      - name: Upload metadata and screenshots
        run: bundle exec fastlane ios metadata
